<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #222; color: white; }
        #video-container { position: relative; width: 640px; height: 480px; }
        video { width: 100%; height: 100%; transform: scaleX(-1); border-radius: 8px; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        .status { margin-top: 10px; font-size: 24px; }
        .warning { color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>
    <div id="status" class="status">Initializing...</div>

    <script type="module" src="renderer.js"></script>
</body>
</html>
